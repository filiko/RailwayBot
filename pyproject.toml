[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "railwaybot"
version = "0.1.0"
description = "Automated Railway deployment error monitoring and extraction"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "filiko"}
]

dependencies = [
    "pyperclip>=1.8.2",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/filiko/RailwayBot"

[project.scripts]
railwaybot = "railwaybot.cli:main"
railwaybot-agent = "railwaybot.agent_api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["railwaybot*"]
